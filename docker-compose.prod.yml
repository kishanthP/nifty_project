name: share-market

# Production stack for one server: database, cache, API, market worker,
# Caddy (HTTPS + the built web app) and daily database backups.
#
# Start or update:   docker compose -f docker-compose.prod.yml up -d --build
# Guide:             deploy/DEPLOY.md
#
# Differences from the development stack: code is baked into the images (no
# auto-reload), the web app is a production build, and only Caddy is reachable
# from the internet (ports 80/443). PostgreSQL and Redis are private.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  build:
    context: ./backend
    args:
      INSTALL_DEV: "false"
  env_file: .env
  environment:
    ENVIRONMENT: production
    AUTH_DEV_MODE: "false"
    FIREBASE_CREDENTIALS_FILE: /app/secrets/firebase-service-account.json
  volumes:
    - ./backend/secrets:/app/secrets:ro
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  api:
    <<: *backend
    # Apply database migrations, then serve with 2 processes (the live feed is
    # shared through Redis, so every process sees every price).
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *backend
    command: python -m app.workers.market_worker
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_AUTH_DEV_MODE: "false"
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. niftyalerts.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # HTTPS certificates: keep this volume
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

  backup:
    image: postgres:16-alpine
    command: ["sh", "/scripts/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./deploy/backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
